[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-graph-claim-audit"
version = "0.1.0"
description = "Offline documentation claim auditor"
requires-python = ">=3.9"
license = "MIT"
readme = "README.md"

[project.scripts]
knowledge-graph-claim-audit = "knowledge_graph_claim_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["knowledge_graph_claim_audit*"]

[tool.setuptools.data-files]
"tests" = ["tests/__init__.py"]
